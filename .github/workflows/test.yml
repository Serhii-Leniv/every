name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # System Ruby (2.6) is the compatibility floor — test against it.
      - name: Syntax check
        run: /usr/bin/ruby -cw bin/every lib/every.rb lib/every/*.rb
      - name: Unit tests
        run: |
          /usr/bin/ruby test/schedule_test.rb
          /usr/bin/ruby test/systemd_test.rb
          /usr/bin/ruby test/runner_test.rb
          /usr/bin/ruby test/store_test.rb
          /usr/bin/ruby test/runtime_test.rb
          /usr/bin/ruby test/cli_test.rb

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: ruby -cw bin/every lib/every.rb lib/every/*.rb
      - name: Unit tests
        run: |
          ruby test/schedule_test.rb
          ruby test/systemd_test.rb
          ruby test/runner_test.rb
          ruby test/store_test.rb
          ruby test/runtime_test.rb
          ruby test/cli_test.rb
      # Validate every generated OnCalendar expression with real systemd.
      # (Same script the `docker` workflow runs in a pinned container.)
      - name: systemd-analyze calendar validation
        run: ruby test/systemd_calendar_check.rb
